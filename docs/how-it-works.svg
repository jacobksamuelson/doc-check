<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <text x="23" y="40" font-size="20" font-weight="600" fill="#111">Your comments get fixed. Then a fresh reviewer catches what the fixes broke.</text>

  <!-- doc-check bracket over steps 3 and 4 -->
  <path d="M495 104 V92 H941 V104" fill="none" stroke="#7fb800" stroke-width="2"/>
  <text x="718" y="82" font-size="13" font-weight="600" fill="#5a8a00" text-anchor="middle" letter-spacing="1">DOC-CHECK ADDS THIS</text>

  <!-- boxes -->
  <g fill="none" stroke="#d9d9d9" stroke-width="1.5">
    <rect x="23" y="112" width="210" height="150" rx="8"/>
    <rect x="259" y="112" width="210" height="150" rx="8"/>
    <rect x="731" y="112" width="210" height="150" rx="8" stroke="#9fd400" stroke-width="2" fill="#f6fbe6"/>
    <rect x="967" y="112" width="210" height="150" rx="8"/>
  </g>
  <rect x="495" y="112" width="210" height="150" rx="8" stroke="#9fd400" stroke-width="2" fill="#f6fbe6"/>

  <g font-size="16" font-weight="600" fill="#111">
    <text x="37" y="142">You review the doc</text>
    <text x="273" y="142">Claude addresses</text>
    <text x="273" y="162">your comments</text>
    <text x="509" y="142">A fresh reviewer</text>
    <text x="509" y="162">reads the whole doc</text>
    <text x="745" y="142">Claude fixes</text>
    <text x="745" y="162">or asks</text>
    <text x="981" y="142">You get the doc and</text>
    <text x="981" y="162">a short report</text>
  </g>
  <g font-size="13.5" fill="#555">
    <text x="37" y="192">and leave 10–20</text>
    <text x="37" y="210">comments</text>

    <text x="273" y="192">each fix is local</text>
    <text x="273" y="210">and correct</text>

    <text x="509" y="192">no comments, no</text>
    <text x="509" y="210">author reasoning;</text>
    <text x="509" y="228">finds what the edits</text>
    <text x="509" y="246">broke elsewhere</text>

    <text x="745" y="192">fixes in place; asks</text>
    <text x="745" y="210">before touching your</text>
    <text x="745" y="228">words or decisions</text>

    <text x="981" y="192">every change that</text>
    <text x="981" y="210">matters, up to three</text>
    <text x="981" y="228">questions</text>
  </g>

  <!-- arrows -->
  <g stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a)">
    <line x1="235" y1="187" x2="256" y2="187"/>
    <line x1="471" y1="187" x2="492" y2="187"/>
    <line x1="707" y1="187" x2="728" y2="187"/>
    <line x1="943" y1="187" x2="964" y2="187"/>
  </g>

  <!-- before note under step 2 -->
  <text x="364" y="290" font-size="13" fill="#8a8a8a" text-anchor="middle">Before: the doc came back here.</text>
  <text x="364" y="308" font-size="13" fill="#8a8a8a" text-anchor="middle">Every fix correct, the doc drifting.</text>

  <!-- loop back for the next round -->
  <path d="M1072 264 V352 H128 V268" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text x="600" y="376" font-size="13" fill="#6b6b6b" text-anchor="middle">next round of comments, same check</text>
</svg>
