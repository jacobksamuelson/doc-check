<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 960 266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How doc-check works: after a round of edits, Claude reads the whole doc, a separate reviewer reads it cold, Claude handles each finding, and you get a short report.</title>
  <rect y="36" width="960" height="266" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <!-- step boxes -->
  <g font-size="11" fill="#6b6b6b" letter-spacing="1.2">
    <text x="16" y="58">1 · AFTER EDITS</text>
    <text x="204" y="58">2 · HAND OFF</text>
    <text x="392" y="58">3 · FRESH REVIEW</text>
    <text x="580" y="58">4 · FIX IN PLACE</text>
    <text x="768" y="58">5 · REPORT</text>
  </g>

  <g fill="none" stroke="#d9d9d9">
    <rect x="16" y="70" width="172" height="120" rx="6"/>
    <rect x="204" y="70" width="172" height="120" rx="6"/>
    <rect x="392" y="70" width="172" height="120" rx="6" stroke="#9fd400" stroke-width="2"/>
    <rect x="580" y="70" width="172" height="120" rx="6"/>
    <rect x="768" y="70" width="176" height="120" rx="6"/>
  </g>

  <g font-size="14" fill="#111111">
    <text x="30" y="100" font-weight="600">Claude reads the</text>
    <text x="30" y="120" font-weight="600">whole doc</text>
    <text x="30" y="146" font-size="12" fill="#444">as it stands now,</text>
    <text x="30" y="163" font-size="12" fill="#444">not just the parts</text>
    <text x="30" y="180" font-size="12" fill="#444">it touched</text>

    <text x="218" y="100" font-weight="600">A separate agent</text>
    <text x="218" y="120" font-weight="600">gets:</text>
    <text x="218" y="144" font-size="12" fill="#444">doc, ask, your rules,</text>
    <text x="218" y="161" font-size="12" fill="#444">sources, what's settled,</text>
    <text x="218" y="178" font-size="12" fill="#444">what's unchecked</text>

    <text x="406" y="100" font-weight="600">It reads cold and</text>
    <text x="406" y="120" font-weight="600">reports under</text>
    <text x="406" y="144" font-size="12" fill="#444">story · consistency ·</text>
    <text x="406" y="161" font-size="12" fill="#444">references · facts ·</text>
    <text x="406" y="178" font-size="12" fill="#444">rules · fragments · cut</text>

    <text x="594" y="100" font-weight="600">Claude handles</text>
    <text x="594" y="120" font-weight="600">every finding</text>
    <text x="594" y="144" font-size="12" fill="#444">fixes in place, asks</text>
    <text x="594" y="161" font-size="12" fill="#444">you, or drops it if</text>
    <text x="594" y="178" font-size="12" fill="#444">it's wrong</text>

    <text x="782" y="100" font-weight="600">You get the</text>
    <text x="782" y="120" font-weight="600">fixed doc</text>
    <text x="782" y="144" font-size="12" fill="#444">plus up to five</text>
    <text x="782" y="161" font-size="12" fill="#444">changes and three</text>
    <text x="782" y="178" font-size="12" fill="#444">questions</text>
  </g>

  <g stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="189" y1="130" x2="202" y2="130"/>
    <line x1="377" y1="130" x2="390" y2="130"/>
    <line x1="565" y1="130" x2="578" y2="130"/>
    <line x1="753" y1="130" x2="766" y2="130"/>
  </g>

  <!-- loop back -->
  <path d="M666 192 C666 250, 478 250, 478 196" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="572" y="262" font-size="12" fill="#6b6b6b" text-anchor="middle">rewrote whole sections? review once more (two passes max)</text>

  <text x="16" y="290" font-size="12" fill="#6b6b6b">The reviewer never sees the author's reasoning. It reads the doc the way its reader will.</text>
</svg>
